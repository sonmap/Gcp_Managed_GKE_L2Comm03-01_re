# L2Comm03-01 디버그 Pod
#
# 배치 Pod는 성공 후 삭제되므로 별도 디버그 Pod를 사용합니다.
# 이 Pod 는 배치와 동일한 환경(이미지 / KSA / NFS 마운트 / 환경변수)으로
# 떠서 대기하므로 kubectl exec 로 들어가 확인할 수 있습니다.
#
# 적용:
#   kubectl apply -f k8s/debug-pod.yaml
#   kubectl -n l2comm-batch wait --for=condition=Ready pod/l2comm-debug --timeout=300s
#   kubectl -n l2comm-batch exec -it l2comm-debug -- bash
#
# 정리:
#   kubectl delete -f k8s/debug-pod.yaml
#
# 참고용 기존 03 매니페스트입니다. RSVP 표준 실행은 docs/RUNBOOK.md을 따릅니다.
apiVersion: v1
kind: Pod
metadata:
  name: l2comm-debug
  namespace: l2comm-batch
  labels:
    app: l2comm-debug
spec:
  restartPolicy: Never
  serviceAccountName: ksa-l2comm-batch

  # 방치되어도 과금이 늘지 않도록 2시간 뒤 스스로 종료합니다.
  activeDeadlineSeconds: 7200

  containers:
    - name: debug
      image: asia-northeast3-docker.pkg.dev/gcp-sbx-edp-gke01/ar-l2comm-python/python-bq-batch:v1
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-c", "sleep 7200"]

      env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /home/jupyter/.oefj
        - name: SA_KEY_PATH
          value: /home/jupyter/.oefj
        - name: BQ_JOB_PROJECT
          value: pjt-c-admin
        - name: EXECUTION_PROJECT
          value: "pjt-c-admin"
        - name: TARGET_PROJECT
          value: "pjt-c-admin"
        - name: TARGET_DATASET
          value: "dlk_sample"
        - name: TARGET_TABLE
          value: "gcp_region_inventory"

      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "500m"
          memory: "1Gi"

      volumeMounts:
        - name: git-nfs
          mountPath: /home/jupyter
          readOnly: true

  volumes:
    - name: git-nfs
      persistentVolumeClaim:
        claimName: l2comm-rsvp-pvc
